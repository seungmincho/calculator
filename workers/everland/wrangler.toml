# D1 name and ID verified against the target Cloudflare account on 2026-11-04.
name = "toolhub-everland-collector"
main = "index.ts"
compatibility_date = "2026-11-01"
workers_dev = false

[observability]
enabled = true
head_sampling_rate = 1

[triggers]
crons = ["*/10 * * * *"]

[[d1_databases]]
binding = "EVERLAND_DB"
database_name = "toolhub"
database_id = "0c60527d-f048-4d7c-ae52-dd050dd02992"
migrations_dir = "migrations"
