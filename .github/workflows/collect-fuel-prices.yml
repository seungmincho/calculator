name: Collect Fuel Prices

on:
  schedule:
    # 매일 오전 10시 (KST) = UTC 01:00
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Collect OPINET prices → Supabase
        env:
          OPINET_API_KEY: ${{ secrets.OPINET_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/collect-fuel-prices.mjs
